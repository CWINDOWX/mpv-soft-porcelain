### 柔雾瓷白 · 番剧影院精简右键菜单与快捷键配置
### 说明：保留所有常用快捷键，右键菜单全面重构为贴合追番/弹幕/Anime4K/OP跳过/Bangumi的核心分组

# ======================== 文件与列表 ========================
#                  script-binding uosc/open-file                         #! 文件 > 打开文件
 Ctrl+Shift+v      loadfile ${clipboard/text}                            #! 文件 > 打开剪贴板
 TAB               script-binding uosc/playlist                          #! 文件 > 播放列表
#                  script-binding uosc/load-subtitles                    #! 文件 > 导入字幕
#                  script-binding uosc/show-in-directory                 #! 文件 > 所在文件夹

# ======================== 音轨与字幕 ========================
#                  script-binding uosc/subtitles                         #! 音轨与字幕 > 字幕轨
#                  script-binding uosc/audio                             #! 音轨与字幕 > 音频轨
#                  script-binding uosc/chapters                          #! 音轨与字幕 > 章节
#                  script-binding uosc/video                             #! 音轨与字幕 > 视频轨
#                  script-binding uosc/editions                          #! 音轨与字幕 > 版本
#                  ignore                                                #! 音轨与字幕 > ---
 Ctrl+Alt+v        cycle sub-visibility                                  #! 音轨与字幕 > 显示字幕
 Alt+z             add sub-delay -0.1                                    #! 音轨与字幕 > 字幕提前
 Alt+x             add sub-delay +0.1                                    #! 音轨与字幕 > 字幕延后
 c                 add audio-delay -0.1                                  #! 音轨与字幕 > 音频提前
 v                 add audio-delay  0.1                                  #! 音轨与字幕 > 音频延后
 Shift+BS          set audio-delay 0 ; set sub-delay 0                   #! 音轨与字幕 > 重置延迟

#                  ignore                                                #! ---

# ======================== 核心功能：弹幕 ========================
 z                 script-message show_danmaku_keyboard                  #! 弹幕 > 弹幕开关
 Ctrl+Shift+d      script-message open_danmaku_style_menu                #! 弹幕 > 弹幕样式
 Ctrl+d            script-message open_search_danmaku_menu               #! 弹幕 > 搜索弹幕
 Alt+d             script-message open_add_source_menu                   #! 弹幕 > 添加弹幕源
 Shift+d           script-message open_add_total_menu                    #! 弹幕 > 弹幕管理

# ======================== 核心功能：画质 ========================
 Shift+a           script-message-to shader_presets open-menu            #! 画质 > 画质预设
 a                 script-message-to shader_presets prev                 #! 画质 > 上一个预设
 d                 script-message-to shader_presets next                 #! 画质 > 下一个预设
#                  ignore                                                #! 画质 > ---
 BS                no-osd set video-zoom 0 ; no-osd set panscan 0 ; no-osd set video-pan-x 0 ; no-osd set video-pan-y 0 ; no-osd set video-align-x 0 ; no-osd set video-align-y 0 ; show-text "已重置画面缩放" #! 画质 > 重置缩放
#                  cycle-values hwdec "auto-copy" "auto" "no"            #! 画质 > 硬件解码
 Ctrl+BS           set contrast 0 ; set brightness 0 ; set gamma 0 ; set saturation 0 ; set hue 0 ; show-text "已重置色彩" #! 画质 > 重置色彩

# ======================== 核心功能：跳过 OP/ED ========================
 s                 script-message-to chapter_skip skip-now               #! 跳过 OP/ED > 立即跳过
 Shift+s           script-message-to chapter_skip open-menu              #! 跳过 OP/ED > 跳过设置
 Alt+BS            script-message-to chapter_skip undo-skip              #! 跳过 OP/ED > 撤销跳过

# ======================== 核心功能：Bangumi ========================
 Ctrl+b            script-message-to bangumi_sync open-menu              #! Bangumi > 同步面板
#                  script-message-to bangumi_sync mark-now from-menu     #! Bangumi > 标记本集已看
#                  script-message-to bangumi_sync open-search            #! Bangumi > 更换番剧关联

#                  ignore                                                #! ---

# ======================== 播放与截图 ========================
 Ctrl+s            screenshot scaled+subtitles                           #! 播放与截图 > 截图（含字幕）
 Ctrl+S            screenshot window                                     #! 播放与截图 > 截图（完整窗口）
#                  screenshot video                                      #! 播放与截图 > 截图（原始帧）
#                  ignore                                                #! 播放与截图 > ---
 ,                 frame-back-step                                       #! 播放与截图 > 上一帧
 .                 frame-step                                            #! 播放与截图 > 下一帧
 l                 ab-loop                                               #! 播放与截图 > AB 循环
#                  script-message-to speed_menu open-menu                #! 播放与截图 > 播放倍速
#                  no-osd set speed 1 ; script-message-to uosc flash-elements controls #! 播放与截图 > 重置倍速
#                  playlist-shuffle                                      #! 播放与截图 > 乱序播放

# ======================== 工具 ========================
#                  script-message-to font_picker open-ui-font            #! 工具 > 界面字体
#                  script-message-to font_picker open-danmaku-font       #! 工具 > 弹幕字体
#                  script-binding uosc/audio-device                      #! 工具 > 音频设备
 Ctrl+i            script-binding uosc/keybinds                          #! 工具 > 快捷键
 I                 script-binding display-stats-toggle                   #! 工具 > 统计信息
#                  script-binding uosc/open-config-directory             #! 工具 > 配置目录
 `                 script-binding commands/open                          #! 工具 > 控制台

#                  ignore                                                #! ---
#                  stop                                                  #! 停止
 Ctrl+q            quit                                                  #! 退出


### ====================== 不映射菜单的快捷按键 ======================

 POWER             quit                                                  # 退出
 PLAY              set pause no                                          # 播放
 PAUSE             set pause yes                                         # 暂停
 PLAYPAUSE         cycle pause                                           # 暂停/播放
 STOP              stop                                                  # 停止
 REWIND            seek -30 ; script-message-to uosc flash-elements timeline
 FORWARD           seek  30 ; script-message-to uosc flash-elements timeline
 PREV              script-binding uosc/prev
 NEXT              script-binding uosc/next

 MBTN_BACK         script-binding uosc/prev
 MBTN_FORWARD      script-binding uosc/next
 MBTN_LEFT         ignore
 MBTN_LEFT_DBL     cycle fullscreen                                      # 双击全屏/窗口
 MBTN_MID          script-binding uosc/menu                              # 中键打开主菜单
 MBTN_RIGHT        script-binding uosc/menu                              # 右键打开精简主菜单
 MBTN_RIGHT_DBL    ignore

 WHEEL_DOWN        no-osd add volume -2 ; script-message-to uosc flash-elements volume
 WHEEL_UP          no-osd add volume  2 ; script-message-to uosc flash-elements volume

 ESC               set fullscreen no
 ENTER             set fullscreen yes
 Alt+ENTER         cycle fullscreen
 SPACE             cycle pause
 UP                set pause yes ; seek -1 exact ; script-message-to uosc flash-elements timeline
 DOWN              set pause yes ; seek  1 exact ; script-message-to uosc flash-elements timeline
 LEFT              seek -5 ; script-message-to uosc flash-elements timeline
 RIGHT             seek  5 ; script-message-to uosc flash-elements timeline
 Ctrl+UP           script-binding uosc/prev
 Ctrl+DOWN         script-binding uosc/next

 [                 no-osd cycle-values speed 2 1.5 1.2 1 ; script-message-to uosc flash-elements controls
 ]                 no-osd cycle-values speed 1 1.2 1.5 2 ; script-message-to uosc flash-elements controls
 {                 no-osd add speed -0.1 ; script-message-to uosc flash-elements controls
 }                 no-osd add speed  0.1 ; script-message-to uosc flash-elements controls
 -                 no-osd add volume -2 ; script-message-to uosc flash-elements volume
 =                 no-osd add volume  2 ; script-message-to uosc flash-elements volume

 Ctrl+Alt+j        cycle sub
 Ctrl+Alt+k        cycle sub down

 1                 add contrast -1
 2                 add contrast  1
 3                 add brightness -1
 4                 add brightness  1
 5                 add gamma -1
 6                 add gamma  1
 7                 add saturation -1
 8                 add saturation  1
 9                 add hue -1
 0                 add hue  1

 Alt+MBTN_LEFT     script-binding positioning/drag-to-pan
 Alt+WHEEL_DOWN    script-binding positioning/cursor-centric-zoom -0.1
 Alt+WHEEL_UP      script-binding positioning/cursor-centric-zoom  0.1
 g                 ignore
 g-m               script-binding select/menu
 g-p               script-binding select/show-properties
