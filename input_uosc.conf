### 柔雾瓷白 · 番剧影院精简右键菜单与快捷键配置
### 说明：保留所有常用快捷键，右键菜单全面重构为贴合追番/弹幕/Anime4K/OP跳过/Bangumi的核心分组

# ======================== 打开与列表 ========================
#                  script-binding uosc/open-file                         #! 打开与列表 > 打开本地文件
 Ctrl+Shift+v      loadfile ${clipboard/text}                            #! 打开与列表 > 播放剪贴板链接
 TAB               script-binding uosc/playlist                          #! 打开与列表 > 播放列表（同目录全集）
#                  script-binding uosc/load-subtitles                    #! 打开与列表 > 导入外部字幕
#                  script-binding uosc/show-in-directory                 #! 打开与列表 > 打开文件所在文件夹

# ======================== 音轨 · 字幕 · 章节 ========================
#                  script-binding uosc/subtitles                         #! 音轨与字幕 > 选择字幕轨
#                  script-binding uosc/audio                             #! 音轨与字幕 > 选择音频轨
#                  script-binding uosc/chapters                          #! 音轨与字幕 > 章节跳转
#                  script-binding uosc/video                             #! 音轨与字幕 > 视频轨
#                  script-binding uosc/editions                          #! 音轨与字幕 > 版本列表
#                  ignore                                                #! 音轨与字幕 > ---
 Ctrl+Alt+v        cycle sub-visibility                                  #! 音轨与字幕 > 开关字幕显示
 Alt+z             add sub-delay -0.1                                    #! 音轨与字幕 > 字幕提前 100ms
 Alt+x             add sub-delay +0.1                                    #! 音轨与字幕 > 字幕延后 100ms
 c                 add audio-delay -0.1                                  #! 音轨与字幕 > 音频提前 100ms
 v                 add audio-delay  0.1                                  #! 音轨与字幕 > 音频延后 100ms
 Shift+BS          set audio-delay 0 ; set sub-delay 0                   #! 音轨与字幕 > 重置音画与字幕同步

#                  ignore                                                #! ---

# ======================== 核心功能：弹幕 ========================
 z                 script-message show_danmaku_keyboard                  #! 弹幕 > 开关弹幕显示
 Ctrl+Shift+d      script-message open_danmaku_style_menu                #! 弹幕 > 弹幕样式滑块面板（拖动实时预览）
 Ctrl+d            script-message open_search_danmaku_menu               #! 弹幕 > 搜索 / 重新匹配番剧弹幕
 Alt+d             script-message open_add_source_menu                   #! 弹幕 > 从 B站 / 巴哈姆特 / 本地 添加弹幕源
 Shift+d           script-message open_add_total_menu                    #! 弹幕 > 弹幕源延迟 · 屏蔽 · 弹幕内容

# ======================== 核心功能：画质增强（Anime4K） ========================
 Shift+a           script-message-to shader_presets open-menu            #! Anime4K 画质 > 选择画质预设（自动记住）
 a                 script-message-to shader_presets prev                 #! Anime4K 画质 > 切换上一个预设
 d                 script-message-to shader_presets next                 #! Anime4K 画质 > 切换下一个预设
#                  ignore                                                #! Anime4K 画质 > ---
 BS                no-osd set video-zoom 0 ; no-osd set panscan 0 ; no-osd set video-pan-x 0 ; no-osd set video-pan-y 0 ; no-osd set video-align-x 0 ; no-osd set video-align-y 0 ; show-text "已重置画面缩放与位置" #! Anime4K 画质 > 重置画面缩放与位置
#                  cycle-values hwdec "auto-copy" "auto" "no"            #! Anime4K 画质 > 切换硬件解码模式
 Ctrl+BS           set contrast 0 ; set brightness 0 ; set gamma 0 ; set saturation 0 ; set hue 0 ; show-text "已重置色彩均衡" #! Anime4K 画质 > 重置色彩参数

# ======================== 核心功能：跳过 OP / ED ========================
 s                 script-message-to chapter_skip skip-now               #! 跳过 OP / ED > 立即跳过当前 OP / ED
 Shift+s           script-message-to chapter_skip open-menu              #! 跳过 OP / ED > 自动跳过设置（右下角提示 / 自动 / 关闭）
 Alt+BS            script-message-to chapter_skip undo-skip              #! 跳过 OP / ED > 退回刚自动跳过的片段

# ======================== 核心功能：Bangumi 同步 ========================
 Ctrl+b            script-message-to bangumi_sync open-menu              #! Bangumi 同步 > 追番同步与账号登录
#                  script-message-to bangumi_sync mark-now               #! Bangumi 同步 > 立即标记本集已看
#                  script-message-to bangumi_sync open-search            #! Bangumi 同步 > 搜索 / 更换目录番剧关联

#                  ignore                                                #! ---

# ======================== 播放与截图 ========================
 Ctrl+s            screenshot scaled+subtitles                           #! 播放与截图 > 截图（含字幕 · 无界面）
 Ctrl+S            screenshot window                                     #! 播放与截图 > 截图（完整窗口含弹幕）
#                  screenshot video                                      #! 播放与截图 > 截图（原始视频帧）
#                  ignore                                                #! 播放与截图 > ---
 ,                 frame-back-step                                       #! 播放与截图 > 上一帧
 .                 frame-step                                            #! 播放与截图 > 下一帧
 l                 ab-loop                                               #! 播放与截图 > 设置 / 清除 AB 循环
#                  no-osd set speed 1 ; script-message-to uosc flash-elements speed #! 播放与截图 > 重置播放速度为 1.0x
#                  playlist-shuffle                                      #! 播放与截图 > 播放列表乱序重排

# ======================== 更多工具 ========================
#                  script-binding uosc/audio-device                      #! 更多工具 > 音频输出设备
 Ctrl+i            script-binding uosc/keybinds                          #! 更多工具 > 快捷键一览
 I                 script-binding display-stats-toggle                   #! 更多工具 > 画面与解码统计信息
#                  script-binding uosc/open-config-directory             #! 更多工具 > 打开配置文件夹
 `                 script-binding commands/open                          #! 更多工具 > 命令行控制台

#                  ignore                                                #! ---
#                  stop                                                  #! 停止播放
 Ctrl+q            quit                                                  #! 退出播放器


### ====================== 不映射菜单的快捷按键 ======================

 POWER             quit                                                  # 退出
 PLAY              set pause no                                          # 播放
 PAUSE             set pause yes                                         # 暂停
 PLAYPAUSE         cycle pause                                           # 暂停/播放
 STOP              stop                                                  # 停止
 REWIND            seek -30 ; script-message-to uosc flash-elements timeline
 FORWARD           seek  30 ; script-message-to uosc flash-elements timeline
 PREV              script-binding uosc/prev
 NEXT              script-binding uosc/next

 MBTN_BACK         script-binding uosc/prev
 MBTN_FORWARD      script-binding uosc/next
 MBTN_LEFT         ignore
 MBTN_LEFT_DBL     cycle fullscreen                                      # 双击全屏/窗口
 MBTN_MID          script-binding uosc/menu                              # 中键打开主菜单
 MBTN_RIGHT        script-binding uosc/menu                              # 右键打开精简主菜单
 Ctrl+MBTN_RIGHT   context-menu                                          # 原生系统菜单
 MBTN_RIGHT_DBL    ignore

 WHEEL_DOWN        no-osd add volume -2 ; script-message-to uosc flash-elements volume
 WHEEL_UP          no-osd add volume  2 ; script-message-to uosc flash-elements volume

 ESC               set fullscreen no
 ENTER             set fullscreen yes
 Alt+ENTER         cycle fullscreen
 SPACE             cycle pause
 UP                set pause yes ; seek -1 exact ; script-message-to uosc flash-elements timeline
 DOWN              set pause yes ; seek  1 exact ; script-message-to uosc flash-elements timeline
 LEFT              seek -5 ; script-message-to uosc flash-elements timeline
 RIGHT             seek  5 ; script-message-to uosc flash-elements timeline
 Ctrl+UP           script-binding uosc/prev
 Ctrl+DOWN         script-binding uosc/next

 [                 no-osd cycle-values speed 2 1.5 1.2 1 ; script-message-to uosc flash-elements speed
 ]                 no-osd cycle-values speed 1 1.2 1.5 2 ; script-message-to uosc flash-elements speed
 {                 no-osd add speed -0.1 ; script-message-to uosc flash-elements speed
 }                 no-osd add speed  0.1 ; script-message-to uosc flash-elements speed
 -                 no-osd add volume -2 ; script-message-to uosc flash-elements volume
 =                 no-osd add volume  2 ; script-message-to uosc flash-elements volume

 Ctrl+Alt+j        cycle sub
 Ctrl+Alt+k        cycle sub down

 1                 add contrast -1
 2                 add contrast  1
 3                 add brightness -1
 4                 add brightness  1
 5                 add gamma -1
 6                 add gamma  1
 7                 add saturation -1
 8                 add saturation  1
 9                 add hue -1
 0                 add hue  1

 Alt+MBTN_LEFT     script-binding positioning/drag-to-pan
 Alt+WHEEL_DOWN    script-binding positioning/cursor-centric-zoom -0.1
 Alt+WHEEL_UP      script-binding positioning/cursor-centric-zoom  0.1
 g                 ignore
 g-m               script-binding select/menu
 g-p               script-binding select/show-properties
