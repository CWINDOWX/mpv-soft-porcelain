### 文档_ https://github.com/hooke007/mpv_PlayKit/blob/main/portable_config/script-opts.conf

##⇘⇘脚本选项


##########
# 控制台 #
##########

#script-opts-append = console-monospace_font=LXGW WenKai Mono
 script-opts-append = console-font_size=16
 script-opts-append = console-scale_with_window=no


#############
# OSD命令行 #
#############

#script-opts-append = commands-persist_history=yes
 script-opts-append = commands-history_path=~~/_cache/command_history.txt


############
# 统计数据 #
############

 script-opts-append = stats-duration=2
 script-opts-append = stats-redraw_delay=0.5
 script-opts-append = stats-persistent_overlay=yes
 script-opts-append = stats-filter_params_max_length=1


########
# YTDL #
########

#script-opts-append = ytdl_hook-try_ytdl_first=yes

#script-opts-append = ytdl_hook-exclude="%.avi$|%.flv$|%.m3u$|%.m3u8$|%.m4v$|%.mkv$|%.mp4$|%.ts$|%.VOB$|%.webm$|%.wmv$"
#script-opts-append = ytdl_hook-use_manifests=yes


######################
# 上下文菜单构建辅助 #
######################

 script-opts-append = contextmenu_plus-input_conf=~~/input_contextmenu_plus.conf
 script-opts-append = contextmenu_plus-uosc_alt=yes
#script-opts-append = contextmenu_plus-max_title_length=80
#script-opts-append = contextmenu_plus-max_playlist_items=30


####################
# 全局属性保存恢复 #
####################

#script-opts-append = save_global_props-save_mode=0
 script-opts-append = save_global_props-props=volume,mute
#script-opts-append = save_global_props-cache_dir=~~/_cache/


################
# 新缩略图引擎 #
################

#script-opts-append = thumbfast-max_height=270
#script-opts-append = thumbfast-max_width=270

#script-opts-append = thumbfast-network=yes
#script-opts-append = thumbfast-hwdec=no

#script-opts-append = thumbfast-sw_threads=3
 script-opts-append = thumbfast-min_duration=30
#script-opts-append = thumbfast-precise=1
#script-opts-append = thumbfast-frequency=1/12


##################
# 多功能控制界面 #
##################

# 柔雾瓷白（Soft Porcelain Mist）亮色柔和主题与丝滑动画配置
 script-opts-append = uosc-color=foreground=3578b8,foreground_text=ffffff,background=f4f6fa,background_text=1e293b,curtain=e2e8f0,success=2a9d6f,error=d6455d,match=2563eb,heatmap=569ce0
 script-opts-append = uosc-opacity=timeline=0.90,position=1,chapters=0.88,slider=0.90,slider_gauge=1,controls=0.90,speed=0.90,menu=0.95,submenu=0.86,border=0.9,title=0.90,tooltip=0.95,thumbnail=1,curtain=0.28,idle_indicator=0.9,audio_indicator=0.85,buffering_indicator=0.5,playlist_position=0.94,heatmap=0.5

 script-opts-append = uosc-border_radius=10
 script-opts-append = uosc-animation_duration=180
 script-opts-append = uosc-text_border=0.8

 script-opts-append = uosc-timeline_style=bar
 script-opts-append = uosc-timeline_size=34
 script-opts-append = uosc-timeline_border=1
 script-opts-append = uosc-progress_size=3

 script-opts-append = uosc-controls_size=34
 script-opts-append = uosc-controls_margin=12
 script-opts-append = uosc-controls_spacing=6
 script-opts-append = uosc-controls=menu,gap,pause_play,gap,prev,items,next,gap,subtitles,<has_many_audio>audio,<has_chapter>chapters,gap,space,speed,space,button:shader_preset,gap,button:danmaku_menu,cycle:chat:show_danmaku@uosc_danmaku:off=comments_disabled/on=chat!?弹幕开关 (Z),gap,button:bgm_sync,gap,fullscreen

 script-opts-append = uosc-top_bar=no-border
 script-opts-append = uosc-top_bar_size=40
 script-opts-append = uosc-volume_size=38
 script-opts-append = uosc-pause_indicator=flash

 script-opts-append = uosc-menu_item_height=40
 script-opts-append = uosc-menu_min_width=420
 script-opts-append = uosc-menu_padding=8

 script-opts-append = uosc-autoload=yes
 script-opts-append = uosc-load_types=video,audio

#script-opts-append = uosc-scale=2

 script-opts-append = uosc-video_types=avi,flv,m2ts,m4v,mkv,mov,mp4,mpeg,mpg,ogv,rm,rmvb,ts,vob,webm,wmv
 script-opts-append = uosc-audio_types=aac,ac3,ape,dsf,dts,flac,m4a,mka,mp3,ogg,opus,wav,wma,wv
 script-opts-append = uosc-image_types=apng,avif,bmp,gif,jfif,jpeg,jpg,jxl,png,svg,tif,tiff,webp
 script-opts-append = uosc-subtitle_types=ass,idx,lrc,mks,pgs,sup,srt,ssa,txt,vtt

 script-opts-append = uosc-default_directory={drives}

 script-opts-append = uosc-languages=slang

 script-opts-append = uosc-idlemsg=拖入番剧开始播放 · 自动识别弹幕
 script-opts-append = uosc-custom_font=LXGW WenKai Mono Lite
