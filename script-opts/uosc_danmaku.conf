# uosc_danmaku 自动番剧识别与多源弹幕配置
api_server=https://danmaku-api.152468.xyz
fallback_server=https://dmku.hls.one

# 打开本地番剧时全自动识别（Hash + 文件名解析 + 同目录续集记忆）并加载弹幕
auto_load=yes
autoload_local_danmaku=yes
autoload_for_url=yes
save_danmaku=no

# 5 秒内重复刷屏弹幕自动合并去重，并统一为简体中文
merge_tolerance=5
chConvert=1

# 弹幕视觉与排版（匹配 mpv-lazy 内置霞鹜文楷字体）
fontname=LXGW WenKai Mono Lite
fontsize=44
bold=yes
opacity=0.78
outline=1.2
shadow=0.6
displayarea=0.72
scrolltime=13
fixtime=5

# 快捷键（与原 KikoPlay 习惯一致：Z 开关弹幕，Ctrl+D 搜索/重配弹幕）
show_danmaku_keyboard_key=z
open_search_danmaku_menu_key=Ctrl+d

# 历史关联记录（位于 portable_config 根目录，已在 .gitignore 中排除）
history_path=~~/danmaku-history.json
message_anlignment=7
message_x=24
message_y=28
